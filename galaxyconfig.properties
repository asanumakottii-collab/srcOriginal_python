# これは OTL Python版 1.5 用の天の川原盤設定ファイルです。
# 実行時に、コマンドラインオプションとして -f (このファイルの名前) を渡すことで使用できます。
# 例: python3 galaxy_transformer.py -f galaxyconfig.properties

# 担当領域は全原盤で銀緯 -20度以上 +20度以下。
# N0: 銀経   0度以上  60度未満
# N1: 銀経  60度以上 120度未満
# S0: 銀経 300度以上 360度未満
# S1: 銀経 180度以上 240度未満
# 銀経120度以上180度未満、240度以上300度未満は対象外。0度と360度は同じ境界。
# N/Sは用紙の上段/下段の識別子で、銀緯の正負を意味しません。

# このファイルの文法は、Javaのプロパティファイルの仕様に準じます。
# この行のように、'#' から始まる行はコメント行であり、動作に影響を与えません。

# 後で何分の一の倍率にするか
scale = 1

# 7.5等星の半径 (mm)
star-radius-7.5 = 0.125

# ドームの半径 (mm)
dome-radius = 6500

# ドームの中心から投影機中心へのベクトルの赤道面に平行な成分 (mm)
projector-horizontal = 355

# ドームの中心から投影機中心へのベクトルの赤道面に垂直な成分 (mm)
projector-vertical = 200

# 投影機の中心と原板の中心の間の距離 (mm)
plate-distance = 50

# 最輝星の等級
galaxy.star.maximum = 7.5

# 最微星の等級
galaxy.star.minimum = 10

# 横に各段の原盤をいくつ配置するか（標準設定では1用紙に上下2枚、計2用紙）
plate.column = 1

# 縦に各段の原盤をいくつ配置するか
plate.row = 1

# ファイル名のプレフィックス
galaxy.file.prefix = galaxy-

# 出力ルートフォルダ（galaxy は自動作成）
output.directory = output

# 白黒反転するか
#   yes: 原板が黒、星が白（エッチング）
#   no: 原板が白、星が黒（リスフィルム）
color.invert = yes
