# これは OTL 1.4 用の設定ファイルです。
# 実行時に、コマンドラインオプションとして -f (このファイルの名前) を渡すことで使用できます。
# 例: java Transformer -f otlconfig.properties

# このファイルの文法は、Javaのプロパティファイルの仕様に準じます。
# この行のように、'#' から始まる行はコメント行であり、動作に影響を与えません。

# 後で何分の一の倍率にするか
scale = 1

# 0等星の半径 (mm)
star-radius = 0.25

# ドームの半径 (mm)
dome-radius = 6000

# ドームの中心と投影機の中心との間の距離 (mm)
projector-distance = 300

# 投影機の中心と原板の中心の間の距離 (mm)
plate-distance = 200

# 焦点距離 (mm)
focal-length = 50

# ユニットを正十二面体の面方向12箇所に配置するかどうか
unit-12 = yes

# ユニットを正十二面体の頂点方向20箇所に配置するかどうか
unit-20 = yes

# ユニットを正十二面体の辺方向30箇所に配置するかどうか
unit-30 = no

# ユニットを正十二面体の対称性をもつ最適な方向60箇所に配置するかどうか
unit-60 = no

# ユニットを赤道付近に配置するかどうか
unit-extra = no

# 最輝星より明るい星を、最輝星で疑似的に表現するかどうか
star.above-maximum = no

# 最輝星の等級
# -Infinity で最輝星を除外しない
# 一等星の基準が 1.5 等(より明るい)のため、通常は 1.5 を指定
star.maximum = 1.5

# 青セロハンを使わない最微星の等級
star.extremum = 3.5

# 青セロハンを使った最微星の等級
star.minimum = 7.5

# 最微星より暗い星を、最微星で疑似的に表現するかどうか
star.under-minimum = no

# 星座線を構成する星の拡大率
# 1大きくなるごとに、4等星相当の星の穴が1等級分大きくなる
star.enlarge-rate = 0.0

# 除外する星を個別にHIP番号で指定
# http://www.rssd.esa.int/index.php?project=HIPPARCOS&page=common
# 上記のリンク先で主な星とHIP番号の対応を見れる
# 例:
#  Capella: 24608
#  Arcturus: 69673
star.excluding =

# 横に各天のユニットをいくつ配置するか
plate.column = 1

# 縦に各天のユニットをいくつ配置するか
plate.row = 1

# 枠の半径 (mm)
plate.frame-radius = 0

# ファイル名のプレフィックス
file.prefix = star-

# 出力フォルダ
output.directory = output

# 各原盤が担当する星域のポリゴンを別SVGとして出力するか
polygon.enabled = yes

# ポリゴンの頂点数。大きいほど境界が滑らかになる
polygon.samples = 180

# 担当星域ポリゴンSVGのファイル名プレフィックス
polygon.file-prefix = polygon-

# 白黒反転するか
#   yes: 原板が黒、星が白（エッチング）
#   no: 原板が白、星が黒（リスフィルム）
color.invert = yes
