# これは OTL 1.4 用の設定ファイルです。
# 実行時に、コマンドラインオプションとして -f (このファイルの名前) を渡すことで使用できます。
# 例: java Transformer -f otlconfig.properties

# このファイルの文法は、Javaのプロパティファイルの仕様に準じます。
# この行のように、'#' から始まる行はコメント行であり、動作に影響を与えません。

# 後で何分の一の倍率にするか
scale = 1

# 0等星の半径 (mm)
star-radius = 0.25

# ドームの半径 (mm)
dome-radius = 6500

# ドームの中心と投影機の中心との間の距離 (mm)
projector-distance = 355

# 投影機の中心と原板の中心の間の距離 (mm)
plate-distance = 300

# 焦点距離 (mm)
focal-length = 50

# ユニットの配置を個別に指定する場合の書式
# unit.custom = yes
#
# ユニットは units[0] から連番で記述します。
# 座標は単位ベクトルか赤経・赤緯を与えることで指定できます。次の4通りのうち、いずれか一つの書式で指定できます。
#
# 1. 直交座標 (x, y, z) を1行で指定
# units[0].xyz = 1 0 0
#
# 2. 直交座標 (x, y, z) を個別に指定
# units[1].x = 0
# units[1].y = 1
# units[1].z = 0
#
# 3. 赤経 (hour) と赤緯 (degree) を1行で指定
# units[2].alpha_delta = 6 45
#
# 4. 赤経 (hour) と赤緯 (degree) を個別に指定
# units[3].alpha = 18
# units[3].delta = -45
#
# 通常は z または赤緯の符号で北・南半球に分類されます。
# 必要な場合は hemisphere = north (n) または south (s) で明示できます。
# units[3].hemisphere = south

# ユニットを正十二面体の面方向12箇所に配置するかどうか
unit-12 = yes

# ユニットを正十二面体の頂点方向20箇所に配置するかどうか
unit-20 = yes

# ユニットを正十二面体の辺方向30箇所に配置するかどうか
unit-30 = no

# ユニットを正十二面体の対称性をもつ最適な方向60箇所に配置するかどうか
unit-60 = no

# ユニットを赤道付近に配置するかどうか
unit-extra = no

# 最輝星より明るい星を、最輝星で疑似的に表現するかどうか
star.above-maximum = no

# 最輝星の等級
# -Infinity で最輝星を除外しない
# 一等星の基準が 1.5 等(より明るい)のため、通常は 1.5 を指定
star.maximum = 1.5

# 最微星の等級
star.minimum = 7.5

# 最微星より暗い星を、最微星で疑似的に表現するかどうか
star.under-minimum = no

# 星座線を構成する星の拡大率
# 0以上2以下。1大きくなるごとに、4等星相当の星の穴が1等級分大きくなる
# 4等星より明るい星は、幅2等級のガウス型テーパーで拡大効果を抑える
star.enlarge-rate = 1.0

# 拡大する星座の IAU88.hlc 内の Name（カンマ区切り）
# 例: Orion, Canis Major, Ursa Major
# 空欄の場合はすべての星座を対象とする
star.enlarge-constellations = Cepheus, Cassiopeia, Andromeda, Cetus, Perseus, Pegasus, Lyra, Cygnus, Aquila, Orion, Taurus, Auriga, Canis Minor, Canis Major, Gemini

# 除外する星を個別にHIP番号で指定
# http://www.rssd.esa.int/index.php?project=HIPPARCOS&page=common
# 上記のリンク先で主な星とHIP番号の対応を見れる
# 例:
#  Capella: 24608
#  Arcturus: 69673
star.excluding =

# 横に各天のユニットをいくつ配置するか
plate.column = 1

# 縦に各天のユニットをいくつ配置するか
plate.row = 1

# 円形原盤の枠半径 (mm)。0の場合は用紙サイズから自動計算
plate.frame-radius = 38.15

# ファイル名のプレフィックス
file.prefix = star-

# 出力ルートフォルダ（star_SVG / star_pdf / polygon_SVG / polygon_pdf は自動作成）
output.directory = output

# 北天・南天のユニットが向く方向を示す配置画像のファイル名
# 出力しない場合は、次の行をコメントアウトする
# unit-position-file = unit-position.png

# 各原盤が担当する星域のポリゴンを別ファイルとして出力するか
polygon.enabled = yes

# ポリゴンの頂点数。大きいほど境界が滑らかになる
polygon.samples = 180

# 担当星域ポリゴンのファイル名プレフィックス
polygon.file-prefix = polygon-

# 白黒反転するか
#   yes: 原板が黒、星が白（エッチング）
#   no: 原板が白、星が黒（リスフィルム）
color.invert = yes
